{% extends 'base.html' %}

{% load static %}





{% block title %}COP Cargo Web - Vouchers{% endblock%}

{% block styles %}

<link rel="stylesheet" href="{% static 'css/mobile_data_views.css' %}">

{% endblock %}



{% block main %}



 <!-- Hero Section -->

    <div data-controller="vouchers" data-vouchers-entries-url-value="{% url 'vouchers-list' %}">

        <section class="hero-section py-5">

            <div class="container-xxl">

                <div class="mb-5">

                    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">

                        <div>

                            <h2 class="h4 mb-1 fw-bold text-dark">Vouchers</h2>

                        </div>

                    </div>



                    <div class="card p-4 mx-auto d-none d-md-block" style="max-width: 56rem;" data-vouchers-target="tableContainer">

                        <table class="table" data-vouchers-target="table">

                            <thead>

                                <tr>

                                    <th>Service Schedule</th>

                                    <th>Arrival Time</th>

                                    <th>Voucher</th>

                                </tr>

                            </thead>

                            <tbody>





                            </tbody>

                        </table>

                    </div>



                    <div class="d-block d-md-none mt-4" data-vouchers-target="mobileContainer">





                    </div>



                



                </div>

            </div>

        </section>

                

    </div>



    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'js/vouchers.js' %}" type="module"></script>

{% endblock %}
